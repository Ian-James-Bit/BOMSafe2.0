name: Build Executable

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever you push a version tag like v1.0.0

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: my_app.exe
            asset_name: my_app-windows.exe
          - os: ubuntu-latest
            artifact_name: my_app
            asset_name: my_app-linux
          - os: macos-latest
            artifact_name: my_app
            asset_name: my_app-macos

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your script has requirements, uncomment the line below:
        # pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name=my_app src/main.py

    - name: Rename Artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: mv dist/my_app.exe dist/${{ matrix.asset_name }}

    - name: Rename Artifact (Unix)
      if: matrix.os != 'windows-latest'
      run: mv dist/my_app dist/${{ matrix.asset_name }}

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
