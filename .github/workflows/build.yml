name: Build Executables

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BOMSafe-Windows
            artifact_path: BOMSafe-Windows.exe

          - os: macos-latest
            artifact_name: BOMSafe-macOS
            artifact_path: BOMSafe-macOS.zip

          - os: ubuntu-latest
            artifact_name: BOMSafe-Linux
            artifact_path: BOMSafe-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --paths . --name=BOMSafe src/main.py

    - name: Prepare Windows Release
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Copy-Item dist/BOMSafe.exe BOMSafe-Windows.exe

    - name: Prepare macOS Release
      if: matrix.os == 'macos-latest'
      run: |
        ditto -c -k --sequesterRsrc --keepParent dist/BOMSafe.app BOMSafe-macOS.zip

    - name: Prepare Linux Release
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp dist/BOMSafe BOMSafe-Linux
        chmod +x BOMSafe-Linux
        tar -czf BOMSafe-Linux.tar.gz BOMSafe-Linux

    - name: Upload Actions Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}

    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.artifact_path }}" --clobber